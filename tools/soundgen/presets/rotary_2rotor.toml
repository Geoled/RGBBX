# Two-rotor Wankel (13B-like). Each rotor fires once per eccentric shaft
# revolution, so the firing rate is twice the shaft frequency: a smooth,
# buzzy, metallic rasp that no piston engine produces.

name = "Rotary 13B 2-rotor"
seed = 787878
notes = "2-rotor Wankel. Fires once per shaft revolution per rotor: buzzy and smooth."

[engine]
idle_rpm = 900.0
redline_rpm = 9000.0
starter_rpm = 300.0

[block]
cylinders = 2
layout = "rotary"
strokes = 4
bore_mm = 102.0
stroke_mm = 80.0
compression = 9.7
rod_ratio = 1.0
ve_peak_rpm_frac = 0.7
ve_peak_value = 1.0
ve_droop = 0.08

[exhaust]
# Short, hot, free-flowing exhaust: bright and buzzy with a metallic edge.
pipe_length_m = 0.65
pipe_temp_c = 780.0
comb_gain = 0.60
comb_repeats = 4
muffler_cutoff_hz = 5000.0
bank_asymmetry = 0.0
modes = [
    [130.0, 2.20, 1.00],
    [208.0, 2.45, 0.96],
    [334.0, 2.65, 0.91],
    [536.0, 2.85, 0.86],
    [862.0, 3.00, 0.79],
    [1385.0, 3.15, 0.71],
    [2226.0, 3.25, 0.62],
    [3577.0, 3.20, 0.52],
    [5500.0, 2.90, 0.40],
]

[intake]
noise_gain = 0.42
pulse_gain = 0.35
runner_length_m = 0.25
band_lo_hz = 300.0
band_hi_hz = 8500.0
modes = [
    [150.0, 1.90, 1.00],
    [235.0, 2.10, 0.95],
    [370.0, 2.30, 0.89],
    [580.0, 2.50, 0.82],
    [920.0, 2.70, 0.73],
    [1500.0, 2.70, 0.62],
    [2500.0, 2.60, 0.50],
    [4200.0, 2.40, 0.38],
    [6500.0, 2.10, 0.28],
]

[turbo]
enabled = false

[mechanical]
valvetrain_gain = 0.036
valvetrain_bright_hz = 5200.0
injector_gain = 0.045
accessory_gain = 0.030
accessory_hz = 280.0

[character]
# A Wankel opens its exhaust port almost instantly, so its pulse has a much
# harder edge than a poppet valve can produce; the brightness has to sit higher
# than a piston engine of the same firing rate to sound right.
brightness_db = 4.2
presence_hz = 1800.0
aggression = 1.55
lumpiness = 0.0
irregularity = 0.03
idle_floor = 0.20
combustion_gain = 0.95

[render]
sample_rate = 48000
bit_depth = 16
channels = 1
block_size = 1024
loop_seconds = 2.0
loop_fade_ms = 10.0
warmup_cycles = 4
peak_db = -1.0
resonator_length_s = 0.10
kernel_taps = 1025
