# Lamborghini Huracán — 5.2 L V10, the DLPA shared with the Audi R8.
# 90-degree V10 with an 18-degree offset crank pin: fires every 54 degrees
# of crank with a slight unevenness that gives it that half-V12 wobble
# under load. Balance-point firing offsets below.

name = "Lamborghini Huracan 5.2 V10"
seed = 20140304
notes = "5.2 L 90 deg V10, 8500 rpm. Offset-pin crank: the ten-cylinder half-V12 wail."

