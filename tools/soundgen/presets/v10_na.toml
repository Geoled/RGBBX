# 5.2 litre naturally aspirated V10 (8500 rpm, supercar).
# Ten cylinders fire every 72 degrees. Two things follow from that: the pulse
# train is dense enough that the gaps between bangs stop being audible, and the
# firing frequency itself is already several hundred hertz, so the engine's
# energy sits where a smaller engine's formants do. That is why a V10 sounds
# like a saw blade rather than a drum.

