# 1.0 litre turbocharged inline three (downsized city car engine).
# Three cylinders cannot hide anything: with only three firings per two
# revolutions the gaps between pulses are long, so the idle rocks and the
# exhaust has a hard offbeat to it. Small cylinders put the whole thing an
# octave higher than a 2.0 four.

