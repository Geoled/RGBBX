# 5.2 litre flat plane crank V8 (exotic / GT350 style, 8250 rpm).
# Same cylinder count, same 90 degree vee, completely different sound to the
# cross plane V8. The crank pins are spaced 180 degrees instead of 90, so the
# two banks fire in strict alternation: left, right, left, right. There is no
# uneven bank sequence and therefore no burble -- instead the two exhaust
# pulses are evenly interleaved and the engine screams. The bank pipes are
# modelled as equal length, which is what that requires.

name = "V8 5.2 Flat-plane"
seed = 20160602
notes = "5.2 L flat plane V8, 8250 rpm. Banks alternate strictly, equal length pipes: even scream, no burble."

[engine]
idle_rpm = 850.0
redline_rpm = 8250.0
starter_rpm = 260.0

[block]
cylinders = 8
layout = "v"
ignition = "spark"
strokes = 4
bore_mm = 94.0
stroke_mm = 93.0
compression = 12.0
bank_angle_deg = 90.0
rod_ratio = 1.62
ve_peak_rpm_frac = 0.68
ve_peak_value = 1.08
ve_droop = 0.08

[exhaust]
pipe_length_m = 1.15
pipe_temp_c = 700.0
comb_gain = 0.58
comb_repeats = 5
muffler_cutoff_hz = 4600.0
# Strictly equal length: any asymmetry here would re-introduce the cross plane
# burble and destroy the whole character of the engine.
bank_asymmetry = 0.0
runner_spread = 0.10
# The continuous bed under the pulses: raising the firing-order AM means
# lowering this too, or the roar swallows the order. 0.25 default, 0.16 here.
flow_noise = 0.16
modes = [
    [84.0, 1.60, 1.00],
    [136.0, 1.80, 0.97],
    [222.0, 2.00, 0.94],
    [365.0, 2.20, 0.90],
    [600.0, 2.40, 0.85],
    [990.0, 2.55, 0.79],
    [1630.0, 2.70, 0.72],
    [2700.0, 2.85, 0.63],
    [4300.0, 2.80, 0.52],
    [6100.0, 2.55, 0.39],
]

[intake]
noise_gain = 0.32
pulse_gain = 0.46
runner_length_m = 0.36
runner_spread = 0.10
band_lo_hz = 260.0
band_hi_hz = 6800.0
modes = [
    [112.0, 1.85, 1.00],
    [176.0, 2.10, 0.96],
    [280.0, 2.35, 0.91],
    [440.0, 2.60, 0.85],
    [700.0, 2.80, 0.78],
    [1100.0, 2.90, 0.68],
    [1740.0, 2.80, 0.56],
    [2760.0, 2.50, 0.43],
    [4400.0, 2.15, 0.31],
]

[turbo]
enabled = false

[mechanical]
valvetrain_gain = 0.086
valvetrain_bright_hz = 4200.0
injector_gain = 0.030
accessory_gain = 0.026
accessory_hz = 240.0

[character]
brightness_db = 4.4
presence_hz = 1900.0
aggression = 1.50
lumpiness = 0.0
irregularity = 0.04
idle_floor = 0.22
# Events above the continuous bed: a flat-plane V8's whole character is the
# even firing order at full song. AM at 100 Hz measured -14 dB at the
# preset defaults; the runtime order-boost (voice) already adds +2.3 dB at
# WOT, so the preset raise stops at 1.20 -- 1.35 double-dipped and pushed
# the 1500 rpm resonance point 3 dB deeper into the limiter.
combustion_gain = 1.20
ccv = 0.09
load_sharpening = 0.72

[render]
sample_rate = 48000
bit_depth = 16
channels = 1
block_size = 1024
loop_seconds = 2.5
loop_fade_ms = 14.0
warmup_cycles = 3
peak_db = -1.0
resonator_length_s = 0.13
kernel_taps = 1025
