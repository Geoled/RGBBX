# 6.0 litre cross-plane V8 (90 degree), American pushrod character.
# Even 90 degree firing, but the two banks get slightly different pipe lengths,
# which produces the classic uneven "burble" and low rumble.

name = "V8 6.0 Cross-plane"
seed = 19690720
notes = "Cross-plane 90 deg V8 pushrod. Deep rumble from bank pipe asymmetry."

[engine]
idle_rpm = 650.0
redline_rpm = 6500.0
starter_rpm = 220.0

[block]
cylinders = 8
layout = "v"
strokes = 4
bore_mm = 102.0
stroke_mm = 92.0
compression = 10.0
bank_angle_deg = 90.0
rod_ratio = 1.55
# Ignition order 1-8-4-3-6-5-7-2 (odd cylinders on bank 0, even on bank 1), as
# firing angles over the 720 degree cycle. The crank pins are 90 degrees apart,
# so each *cylinder* fires at an even 90 degree interval -- but the banks do
# not alternate. Bank 0 fires at 0, 270, 450 and 540 degrees, so the right hand
# pipe gets two firings close together and then a long gap. That uneven bank
# sequence, not any detuning, is the cross plane burble.
firing_offsets = [0.000, 0.875, 0.375, 0.250, 0.625, 0.500, 0.750, 0.125]

[exhaust]
pipe_length_m = 1.35
pipe_temp_c = 580.0
