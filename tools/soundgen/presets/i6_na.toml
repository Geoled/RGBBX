# 3.0 litre naturally aspirated inline six (high revving, individual throttle
# bodies). Six cylinders in line is the smoothest piston layout there is: even
# 120 degree firing, perfect primary and secondary balance, no beat at all.
# What is left when the roughness is gone is the intake: long equal runners
# resonating together, which is why an I6 sounds like one clean metallic note
# rather than a collection of pulses.

name = "I6 3.0 NA"
seed = 20011005
notes = "3.0 L NA inline six, 8000 rpm. Dead smooth, intake resonance dominated, metallic."

[engine]
idle_rpm = 800.0
redline_rpm = 8000.0
starter_rpm = 240.0

