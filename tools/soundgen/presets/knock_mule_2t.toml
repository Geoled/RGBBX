# Knock research mule: a 2.0 turbo four with 9.8:1 static compression, a
# small intercooler and regular 87-octane fuel -- deliberately marginal, the
# classic "tuned turbo on pump gas" combination. It demonstrates the full
# knock loop: tendency rises off-boost, the sensor pulls timing, torque
# dips, and everything recovers when the load comes off.

name = "Knock Mule 2.0T 87"
seed = 44444444
notes = "Research mule: 9.8:1 + 1.4 bar + 87 octane + weak intercooler. Detonates on low-rpm WOT by design."

[engine]
idle_rpm = 850.0
redline_rpm = 6800.0
