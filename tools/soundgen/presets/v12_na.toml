# 6.5 litre naturally aspirated V12 (8500 rpm, flagship GT).
# Twelve firings every 720 degrees is one every 60 degrees. A V12 is really two
# straight sixes on a common crank, so it is perfectly balanced and perfectly
# even, and the pulse train is so dense that it stops sounding like pulses at
# all. What is left is the pure tone of the whole system: the widest, smoothest
# spectrum of any piston engine here, and the highest firing order, which is
# why a V12 is described as a scream rather than a rumble.

