# 3.0 litre twin turbo 90 degree V6 (modern sports saloon).
# A 90 degree V6 would naturally fire at 90/150 degree intervals, which is why
# old ones sound lumpy; the modern ones use a split crank pin so the firing is a
# clean 120 degrees, the same as an inline six. Two small turbos mean the
# exhaust note is short and hard and the top end is dominated by spool.

name = "V6 3.0 Twin-Turbo"
seed = 20150501
notes = "3.0 L 90 deg V6, split pin even firing, twin turbo. Short hard note under the spool."

[engine]
