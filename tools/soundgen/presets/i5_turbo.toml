# 2.5 litre turbocharged inline five (the classic quattro engine).
# Five cylinders fire every 144 degrees, so the pulse train never settles into
# the simple symmetry of a four or a six. The result is the famous warble: half
# order content that no amount of even firing removes. It is reproduced here by
# deliberately spreading the primary runner lengths, which is what makes the
# real engine warble too.

name = "I5 2.5 Turbo"
seed = 20090311
notes = "2.5 L five cylinder turbo. Even 144 deg firing, but uneven runners give the half order warble."

[engine]
idle_rpm = 800.0
redline_rpm = 7000.0
starter_rpm = 240.0

[block]
