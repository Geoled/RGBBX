# 4.0 litre naturally aspirated flat six (911 GT3 style, 9000 rpm).
# A flat six is two opposing threes, and it is the only large engine that will
# happily turn 9000 rpm: short stroke, huge ports, equal length headers. Nothing
# is unbalanced, nothing is uneven -- all of the character is high frequency
# body resonance and intake honk, which is why it howls rather than rumbles.

