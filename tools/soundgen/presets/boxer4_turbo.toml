# 2.5 litre turbocharged flat four (unequal length headers).
# The engine itself fires perfectly evenly -- a flat four is balanced and its
# pulses arrive at a steady 180 degrees. The rumble comes entirely from the
# exhaust: one bank's header is much longer than the other, so its pulses reach
# the collector late and the two banks never interleave cleanly. Modelling that
# as a real difference in pipe length (rather than as vibrato) is what makes it
# sound like a boxer instead of a detuned four.

name = "Flat-4 2.5 Turbo"
seed = 20040102
notes = "2.5 L boxer four turbo with unequal length headers: even firing, very uneven pipes."

[engine]
idle_rpm = 750.0
redline_rpm = 6700.0
starter_rpm = 250.0

[block]
